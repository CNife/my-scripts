[project]
  name = "personal-scripts"
  version = "0.1.0"
  description = "Add your description here"
  readme = "README.md"
  requires-python = ">=3.12"
  dependencies = [
    "exifread",
    "typer",
    "rich",
    "scipy>=1.16.3",
    "pandas>=2.3.3",
    "peewee>=3.18.3",
    "openpyxl>=3.1.5",
    "tqdm",
    "pillow>=10.0.0",
    "pillow-heif>=0.13.0",
    "tushare>=1.4.24",
    "matplotlib>=3.10.8",
    "seaborn>=0.13.2",
    "dotenv>=0.9.9",
]

[tool.uv]
  package = true

[build-system]
  requires = ["setuptools>=61.0"]
  build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
  where = ["."]
  include = ["*"]
  exclude = [".venv", ".git", ".pytest_cache", ".ruff_cache", ".sisyphus", "skills"]
  namespaces = false

[dependency-groups]
  dev = [
    "ipython",
    "pre-commit",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-timeout>=2.4.0",
]

[tool.pytest.ini_options]
  timeout = 30
  markers = [
    "network: marks tests as requiring network access (deselect with '-m \"not network\"')",
  ]

[tool.ruff]
  target-version = "py314"
  line-length = 100

  [tool.ruff.lint]
    extend-select = ["B", "C4", "I", "PIE", "RUF", "S", "SIM", "UP", "W"]
    ignore = ["RUF001", "RUF002", "RUF003", "S607", "S101"]
